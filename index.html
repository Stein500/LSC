    <meta name="theme-color" content="#5C2E0C" />
    <script>
      (function () {
        try {
          var key = "colombes_theme_mode";
          var mode = localStorage.getItem(key) || "auto";
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = mode === "auto" ? (systemDark ? "dark" : "light") : mode;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme === "light" ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "light" ? "#5C2E0C" : theme === "amoled" ? "#000000" : "#150D11");
        } catch (e) {}
      })();
    </script>
