    <h1>Inspirations du monde — Galerie couture multiculturelle (Porto-Novo)</h1>
    <p>Une balade douce entre visages, matières et lumière : 18 profils multiculturels, 4 images éditoriales, 5 continents — la vision couture de l'atelier Les Services Colombes à Porto-Novo, qui relie Porto-Novo à l'Afrique de l'Ouest, au Maghreb, à l'Asie et à l'Europe.</p>
    <p><a href="https://couturecolombe.vercel.app/inspirations">Accéder à la galerie complète</a></p>
    <h2>La galerie en 4 images</h2>
    <ul>
      <li><strong>Wax — la pièce signature</strong> — pièce de wax multicolore sur mannequin invisible, captée en lumière naturelle.</li>
      <li><strong>Matières — wax, bazin, pagne, lin</strong> — mélange de tissus africains et européens, gros plan sur les textures.</li>
      <li><strong>Silhouette — heure dorée</strong> — portrait éditorial en bazin brodé, capté à l'heure dorée.</li>
      <li><strong>Outils — le geste et la matière</strong> — flat lay d'outils de couture, ciseaux, fil, aiguilles, patrons.</li>
    </ul>
    <h2>Les 18 profils</h2>
    <ul>
    <li><strong>Aïcha S. — Porto-Novo</strong> (🇧🇯 BJ) — pagne tissé béninois. Une allure douce, des matières locales et une finition pleine de tendresse ✨</li>
    <li><strong>Mariam K. — Cotonou</strong> (🇧🇯 BJ) — robe contemporaine. Une silhouette vive, pensée pour bouger avec aisance et élégance 🤍</li>
    <li><strong>Grâce T. — Parakou</strong> (🇧🇯 BJ) — ensemble cérémonial. Une présence lumineuse, avec une coupe nette et des détails très soignés 🌷</li>
    <li><strong>Nadine A. — Ouidah</strong> (🇧🇯 BJ) — tenue de fête. Une pièce joyeuse, équilibrée entre tradition et modernité 🌸</li>
    <li><strong>Sandrine D. — Abomey</strong> (🇧🇯 BJ) — bazin élégant. Un rendu riche, structuré et pensé pour les grands moments 🧵</li>
    <li><strong>Rita Z. — Bohicon</strong> (🇧🇯 BJ) — tenue de cérémonie. Une coupe calme, précise et pleine de noblesse textile ✨</li>
    <li><strong>Fatou D. — Ouagadougou</strong> (🇧🇫 BF) — Faso danfani. Un hommage à la matière locale avec une allure moderne et affirmée 🤍</li>
    <li><strong>Aminata T. — Bobo-Dioulasso</strong> (🇧🇫 BF) — tenue tissée. Des lignes amples, des textures fortes et une vraie douceur visuelle 🌿</li>
    <li><strong>Léonie K. — Dakar</strong> (🇸🇳 SN) — boubou sénégalais. Une énergie festive, des contrastes nets et des finitions pleines d’élan ✨</li>
    <li><strong>Naïma E. — Casablanca</strong> (🇲🇦 MA) — caftan marocain. Une silhouette raffinée, pensée pour les cérémonies et les détails précieux 🌙</li>
    <li><strong>Yasmine R. — Tunis</strong> (🇹🇳 TN) — robe orientale. Une élégance douce, structurée par des plis et des volumes délicats 🌸</li>
    <li><strong>Hina Y. — Tokyo</strong> (🇯🇵 JP) — kimono revisité. Une lecture contemporaine de la tradition, légère et très précise 🪡</li>
    <li><strong>Lydie M. — Abidjan</strong> (🇨🇮 CI) — pagne moderne ivoirien. Un style solaire, rythmé par une coupe claire et des finitions nettes ☀️</li>
    <li><strong>Espérance N. — Kigali</strong> (🇷🇼 RW) — tenue rwandaise revisitée. Une tenue claire, soignée et pleine de fraîcheur contemporaine 🤍</li>
    <li><strong>Camille R. — Lyon</strong> (🇫🇷 FR) — robe de cérémonie. Une pièce nette, lumineuse et pensée pour un rendu très couture ✨</li>
    <li><strong>Inès O. — Lisbonne</strong> (🇵🇹 PT) — robe de soirée. Un style fluide, chic et facile à porter pour des moments précieux 🌷</li>
    <li><strong>Khadija F. — Alger</strong> (🇩🇿 DZ) — karakou. Une pièce de caractère, travaillée dans les lignes et les finitions 🤍</li>
    <li><strong>Rosa M. — Naples</strong> (🇮🇹 IT) — robe italienne. Un style très féminin, sobre et sensuel dans ses volumes 🌸</li>
    </ul>
    <h2>5 continents, une même couture</h2>
    <ul>
      <li><strong>Afrique de l'Ouest</strong> 🇧🇯🇧🇫🇸🇳🇨🇮 — Porto-Novo, Cotonou, Parakou, Ouidah, Abomey, Bohicon, Ouagadougou, Bobo-Dioulasso, Dakar, Abidjan.</li>
      <li><strong>Maghreb &amp; Afrique du Nord</strong> 🇲🇦🇹🇳🇩🇿 — Casablanca, Tunis, Alger.</li>
      <li><strong>Asie &amp; Afrique de l'Est</strong> 🇯🇵🇷🇼 — Tokyo, Kigali.</li>
      <li><strong>Europe du Sud</strong> 🇮🇹🇵🇹 — Naples, Lisbonne.</li>
      <li><strong>Europe francophone</strong> 🇫🇷 — Lyon.</li>
    </ul>
    <h2>FAQ — Inspirations</h2>
    <h3>Les profils sont-ils de vrais clients ?</h3>
    <p>Oui, tous les profils présentés sont des clientes et clients réels de l'atelier à Porto-Novo, photographiés avec leur accord.</p>
    <h3>Je peux être photographié·e pour rejoindre la galerie ?</h3>
    <p>Bien sûr — lors d'un essayage final ou d'une commande livrée, on vous propose une photo douce pour rejoindre le Wall of Love, si vous le souhaitez.</p>
    <h3>Vous livrez dans d'autres pays ?</h3>
    <p>Pour le moment l'atelier confectionne à Porto-Novo et livre localement. Pour l'international, on peut étudier au cas par cas via WhatsApp.</p>
    <h3>Comment demander une tenue inspirée de la galerie ?</h3>
    <p>Cliquez sur "Entrer dans l'atelier" puis utilisez le formulaire de pré-commande en précisant la matière et la silhouette qui vous inspirent — on revient vers vous sous 48h.</p>
