    <h2>Nos prestations</h2>

      <li><strong>Ensembles mère-fille</strong> — Looks coordonnés pour une présence forte et élégante en famille.</li>
      <li><strong>Tenues de bureau féminines</strong> — Chemisiers, jupes, tailleurs et robes sobres pour le quotidien professionnel.</li>
      <li><strong>Retouches & ajustements</strong> — Reprises, modernisations et petites transformations pour faire durer vos pièces.</li>
      <li><strong>Finitions surfileuse EMEL</strong> — Surjet net, solide et durable pour une tenue professionnelle.</li>
      <li><strong>Pose boutons / pressions</strong> — Service rapide pour des fermetures propres et résistantes.</li>
      <li><strong>Layette & trousseaux bébé fille</strong> — Habits doux et soignés pour nouveau-née et jeune enfant.</li>
